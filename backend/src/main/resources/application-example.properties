spring.application.name=parcialfinal
server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/parcialfinal?createDatabaseIfNotExist=true&serverTimezone=America/Bogota}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=CAMBIAR_POR_UNA_CLAVE_DE_AL_MENOS_32_CARACTERES
jwt.expiration=86400000

cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

app.admin.username=admin
app.admin.password=1234567890

springdoc.swagger-ui.path=/
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.displayRequestDuration=true
